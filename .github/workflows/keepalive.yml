name: Supabase Keepalive

on:
  schedule:
    # Setiap 3 hari sekali jam 08:00 UTC (15:00 WIB)
    - cron: '0 8 */3 * *'
  # Bisa dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase DB
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run keepalive
        run: node scripts/keepalive.mjs 2>&1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Repo publik: GitHub men-disable scheduled workflow setelah 60 hari tanpa aktivitas.
      # Enable ulang tiap run untuk reset timer itu (tanpa commit dummy).
      # ponytail: tidak ada jaminan resmi GitHub; kalau tetap ter-disable, ganti ke commit file timestamp.
      - name: Reset timer 60 hari GitHub
        if: always()
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
